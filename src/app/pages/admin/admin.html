<div class="admin-layout">
  <div class="sidebar-backdrop" [class.show]="isSidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.sidebar-open]="isSidebarOpen">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        🍕 <span>Cravyo</span>
      </div>

      <button class="sidebar-close-btn" type="button" (click)="closeSidebar()">
        ✕
      </button>
    </div>

    <div class="sidebar-section-label">Management</div>

    <nav class="sidebar-nav">
      <a routerLink="restaurants" routerLinkActive="active" class="nav-link-item" (click)="handleNavClick()">
        <span class="nav-icon">🏪</span> Restaurants
      </a>

      <a routerLink="menu-items" routerLinkActive="active" class="nav-link-item" (click)="handleNavClick()">
        <span class="nav-icon">🍽️</span> Menu Items
      </a>

      <a routerLink="users" routerLinkActive="active" class="nav-link-item" (click)="handleNavClick()">
        <span class="nav-icon">👥</span> Users
      </a>

      <a routerLink="orders" routerLinkActive="active" class="nav-link-item" (click)="handleNavClick()">
        <span class="nav-icon">📦</span> Orders
      </a>

      <a routerLink="coupons" routerLinkActive="active" class="nav-link-item" (click)="handleNavClick()">
        <span class="nav-icon">🎟️</span> Coupons
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        <div>
          <div class="user-name">{{ userName }}</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>

      <button class="sidebar-logout-btn" type="button" (click)="logout()">
        Logout
      </button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle-btn" type="button" (click)="toggleSidebar()">
          ☰
        </button>
        <span class="topbar-title">Admin Panel</span>
      </div>
    </header>

    <div class="content-area">
      <router-outlet />
    </div>
  </div>
</div>
