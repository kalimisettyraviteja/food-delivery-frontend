<!-- Page Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-0">🏪 Restaurants</h4>
    <p class="text-muted small mb-0">Manage all restaurant listings</p>
  </div>
  <button class="btn btn-orange" (click)="openAdd()">
    + Add Restaurant
  </button>
</div>

<!-- Toast -->
<div *ngIf="successMsg" class="alert alert-success alert-dismissible py-2 px-3 small">
  ✅ {{ successMsg }}
</div>

<!-- Loading Skeletons -->
<div *ngIf="loading()" class="row g-3">
  <div class="col-md-4" *ngFor="let i of [1,2,3]">
    <div class="skeleton-card"></div>
  </div>
</div>

<!-- Restaurant Cards Grid -->
<div class="row g-3" *ngIf="!loading()">
  <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let r of restaurants()">
    <div class="rest-card card h-100">
      <div class="rest-card-banner">
        <span class="cuisine-tag">{{ r.cuisine }}</span>
      </div>
      <div class="card-body pb-2">
        <h6 class="fw-bold mb-1">{{ r.name }}</h6>
        <p class="text-muted small mb-0">📍 {{ r.location }}</p>
      </div>
      <div class="card-footer bg-white border-0 d-flex gap-2 pt-0 pb-3 px-3">
        <button class="btn btn-sm btn-outline-orange flex-fill" (click)="openEdit(r)">
          ✏️ Edit
        </button>
        <button class="btn btn-sm btn-outline-danger flex-fill" (click)="delete(r.id!, r.name)">
          🗑 Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="restaurants().length === 0" class="col-12 text-center py-5 text-muted">
    <div style="font-size:48px">🏪</div>
    <p class="mt-2">No restaurants yet. Add your first one!</p>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop-custom" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-box-header">
      <h5 class="fw-bold mb-0">{{ isEdit ? '✏️ Edit' : '➕ Add' }} Restaurant</h5>
      <span class="close-btn" (click)="closeModal()">✕</span>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger py-2 small">{{ errorMsg }}</div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Restaurant Name</label>
      <input type="text" class="form-control" [(ngModel)]="form.name"
        name="name" placeholder="e.g. Spice Garden" />
    </div>
    <div class="row g-3">
      <div class="col-6">
        <label class="form-label fw-semibold">Location</label>
        <input type="text" class="form-control" [(ngModel)]="form.location"
          name="location" placeholder="Chennai" />
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Cuisine</label>
        <input type="text" class="form-control" [(ngModel)]="form.cuisine"
          name="cuisine" placeholder="South Indian" />
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-end mt-4">
      <button class="btn btn-light" (click)="closeModal()">Cancel</button>
      <button class="btn btn-orange" (click)="save()">
        {{ isEdit ? 'Update' : 'Save Restaurant' }}
      </button>
    </div>
  </div>
</div>
