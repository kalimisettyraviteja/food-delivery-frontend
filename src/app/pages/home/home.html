<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="home-wrap d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold text-orange brand-logo" routerLink="/home/main">
      <span class="brand-emoji">🍕</span>
      <span>FoodDelivery</span>
    </a>

    <div class="d-flex align-items-center gap-3">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn btn-outline-orange btn-sm">Sign in</a>
        <a routerLink="/register" class="btn btn-orange btn-sm">Register</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <div class="top-user-chip d-none d-md-flex">
          <ng-container *ngIf="profilePhotoUrl; else navTextAvatar">
            <img [src]="profilePhotoUrl" alt="Profile" class="top-user-photo" />
          </ng-container>

          <ng-template #navTextAvatar>
            <div class="top-user-avatar">
              {{ userName.charAt(0).toUpperCase() }}
            </div>
          </ng-template>

          <span class="top-user-name">👋 {{ userName }}</span>
        </div>

        <button
          class="btn account-menu-btn btn-sm"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#accountMenu"
          aria-controls="accountMenu"
        >
          <i class="fa-solid fa-bars-staggered menu-icon"></i>
        </button>
      </ng-container>
    </div>
  </div>
</nav>

<!-- Offcanvas -->
<div
  class="offcanvas offcanvas-end account-offcanvas"
  tabindex="-1"
  id="accountMenu"
  aria-labelledby="accountMenuLabel"
>
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="accountMenuLabel">My Account</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <div class="offcanvas-body">
    <div class="account-user-card mb-4">
      <div class="account-user">
        <ng-container *ngIf="profilePhotoUrl; else textAvatar">
          <img [src]="profilePhotoUrl" alt="Profile" class="account-avatar-img" />
        </ng-container>

        <ng-template #textAvatar>
          <div class="account-avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        </ng-template>

        <div class="account-user-copy">
          <div class="fw-semibold account-name">{{ userName }}</div>
          <div class="small text-muted">FoodDelivery User</div>
        </div>
      </div>
    </div>

    <div class="account-menu">
      <a routerLink="/home/orders" class="account-link" data-bs-dismiss="offcanvas">
        <span class="account-link-icon icon-orange">
          <i class="fa-solid fa-box-open fa-bounce-hover"></i>
        </span>
        <span>Order History</span>
      </a>

      <a routerLink="/home/profile" class="account-link" data-bs-dismiss="offcanvas">
        <span class="account-link-icon icon-orange">
          <i class="fa-solid fa-user-pen fa-float-hover"></i>
        </span>
        <span>Profile</span>
      </a>

      <a routerLink="/home/addresses" class="account-link" data-bs-dismiss="offcanvas">
        <span class="account-link-icon icon-orange">
          <i class="fa-solid fa-location-dot fa-wiggle-hover"></i>
        </span>
        <span>Saved Addresses</span>
      </a>

      <button class="account-link logout-link" type="button" (click)="logout()" data-bs-dismiss="offcanvas">
        <span class="account-link-icon icon-red">
          <i class="fa-solid fa-right-from-bracket fa-slide-hover"></i>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>

<router-outlet />
