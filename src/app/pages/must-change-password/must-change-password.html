<div class="password-page">
  <div class="password-card">
    <div class="password-brand">
      <img src="assets/logo6.png" alt="Cravyo logo" />
    </div>

    <h1>Set your new password</h1>

    <p class="intro-text">
      Your account was created with a temporary password. Please set a new
      password before continuing.
    </p>

    <div class="alert error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form #passwordForm="ngForm" (ngSubmit)="changePassword()">
      <div class="input-group-box">
        <label for="newPassword">New password</label>

        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          placeholder="Enter your new password"
          required
          minlength="4"
        />
      </div>

      <div class="input-group-box">
        <label for="confirmPassword">Confirm new password</label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter your new password"
          required
          minlength="4"
        />
      </div>

      <p
        class="validation-message"
        *ngIf="
          confirmPassword.length > 0 &&
          newPassword !== confirmPassword
        "
      >
        Passwords do not match.
      </p>

      <p
        class="validation-message success-text"
        *ngIf="passwordsMatch"
      >
        Passwords match.
      </p>

      <button
        type="submit"
        class="set-password-btn"
        [disabled]="loading || !formValid || passwordForm.invalid"
      >
        {{ loading ? 'Setting password...' : 'Set password' }}
      </button>
    </form>

    <button
      type="button"
      class="logout-btn"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</div>
